[package]
name = "mullion-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mullion"
path = "src/main.rs"

# 架构不变量:app 是唯一允许知道 core/term/ssh/store 的地方。依赖方向 app → {core, term, ssh, store}。
[dependencies]
mullion-core = { path = "../mullion-core" }
mullion-term = { path = "../mullion-term" }
mullion-ssh = { path = "../mullion-ssh" }
mullion-store = { path = "../mullion-store" }
winit.workspace = true
wgpu.workspace = true
glyphon.workspace = true
# 拨测(F92)要 tokio::time::timeout。现在不写也能编过,是因为 russh 0.54.5
# 打开了 tokio 的 time —— feature 是并集,靠别人的依赖泄漏过来是运气,
# 哪天 russh 收窄就整片编不过。显式声明。
tokio = { workspace = true, features = ["time"] }
russh.workspace = true
bytemuck = { version = "1", features = ["derive"] }
directories = "5"
# F100 标注模式的自动候选:模式开着时 egui 每帧吐一棵含全部控件的 accesskit 树,
# 拿来当候选(见 `ui/annotate.rs`)—— 没有它,能标注的就只有手工插桩的那几十个
# 容器,按钮/输入框/复选框一个都点不中。
# `egui-winit` 的同名 feature **必须同步开**:它对 `PlatformOutput` 做穷尽解构,
# egui 那边多出 `accesskit_update` 字段而它这边没开,就是 E0027 整片编不过。
# 我们**不调** `State::init_accesskit`,所以 adapter 恒为 `None`,不注册 Windows
# UIA,没有平台侧开销;代价只是 exe 里多带 accesskit(交叉编译已验证,新增的
# `uiautomationcore.dll`/`propsys.dll` 都是 Windows 自带的系统 DLL)。
egui = { workspace = true, features = ["accesskit"] }
egui-wgpu.workspace = true
egui-winit = { workspace = true, features = ["accesskit"] }
rfd.workspace = true
time.workspace = true
log.workspace = true
arboard.workspace = true
ico.workspace = true
base64.workspace = true
unicode-width.workspace = true

# AttachConsole:GUI 子系统下从终端启动仍能看 CLI 诊断。
# ProcessStatus/SystemInformation/Threading:diag 的内存采样(卡死时判断是否内存
# 压力)。windows-sys 已在依赖树里(winit/wgpu 带的),这里只多开几个 feature。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
# F59 拖出到资源管理器:要**实现** COM 接口(IDataObject/IStream/IDropSource),
# 而 windows-sys 只给裸 FFI 声明,给不出 vtable。所以这里额外要带 `implement`
# 宏的 `windows` crate —— 它已经在依赖树里(wgpu 带的),只多开几个 feature。
# (0.59 里 `implement` 是无条件导出的,没有同名 feature 可开。)
# Win32_Graphics_Gdi 不是画图用的:`STGMEDIUM` 的联合体里有 HBITMAP,
# 它的 cfg 门就挂在这个 feature 上,不开的话整个 STGMEDIUM 都不存在。
#
# `windows-core` 必须**显式列出且版本对齐**:`#[implement]` 展开出来的是
# `::windows_core::…` 绝对路径,要求 crate 根上有这个名字;而依赖树里同时
# 存在 0.58/0.59/0.62 三份,版本错一位就是「trait 没实现」的天书报错。
windows-core = "0.59"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3"
# 自动化的假时钟测试(`#[tokio::test(start_paused = true)]`)要 test-util。
# feature 是并集,这里只是在 test target 上多开一个,不影响正式构建。
tokio = { workspace = true, features = ["test-util"] }
# 离屏 UI 截图 harness(`examples/ui_shot.rs`):无头把 egui 外壳渲染成 PNG,
# 给「改完能自己看一眼」用。**只在 example/test target 生效**,不进 exe。
#
# 它也给 egui 开 accesskit feature —— 从 F100 自动候选那一版起,正式依赖里
# 已经开了同一个 feature(见上面 `[dependencies]` 的 egui/egui-winit),所以
# 这里不再需要额外声明 `egui-winit` 来对齐两个同名 feature。
egui_kittest = { version = "0.30", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# 自建 wgpu device 要阻塞等 `request_device`。TestRenderer::new() 会取
# 枚举到的第一个 adapter(不可控),故不用它,见 examples/ui_shot.rs。
pollster = "0.4"
