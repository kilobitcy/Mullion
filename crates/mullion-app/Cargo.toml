[package]
name = "mullion-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mullion"
path = "src/main.rs"

# 架构不变量:app 是唯一允许知道 core/term/ssh/store 的地方。依赖方向 app → {core, term, ssh, store}。
[dependencies]
mullion-core = { path = "../mullion-core" }
mullion-term = { path = "../mullion-term" }
mullion-ssh = { path = "../mullion-ssh" }
mullion-store = { path = "../mullion-store" }
winit.workspace = true
wgpu.workspace = true
glyphon.workspace = true
# 拨测(F92)要 tokio::time::timeout。现在不写也能编过,是因为 russh 0.54.5
# 打开了 tokio 的 time —— feature 是并集,靠别人的依赖泄漏过来是运气,
# 哪天 russh 收窄就整片编不过。显式声明。
tokio = { workspace = true, features = ["time"] }
russh.workspace = true
bytemuck = { version = "1", features = ["derive"] }
directories = "5"
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
rfd.workspace = true
time.workspace = true
log.workspace = true
arboard.workspace = true
ico.workspace = true
base64.workspace = true

# AttachConsole:GUI 子系统下从终端启动仍能看 CLI 诊断。
# ProcessStatus/SystemInformation/Threading:diag 的内存采样(卡死时判断是否内存
# 压力)。windows-sys 已在依赖树里(winit/wgpu 带的),这里只多开几个 feature。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# 自动化的假时钟测试(`#[tokio::test(start_paused = true)]`)要 test-util。
# feature 是并集,这里只是在 test target 上多开一个,不影响正式构建。
tokio = { workspace = true, features = ["test-util"] }
# 离屏 UI 截图 harness(`examples/ui_shot.rs`):无头把 egui 外壳渲染成 PNG,
# 给「改完能自己看一眼」用。**只在 example/test target 生效**,不进 exe。
# 它给 egui 开 accesskit feature —— feature 是并集,故 `cargo test` 会多编
# accesskit,但 `cargo build --release` 不含 dev-deps,正式构建不受影响。
egui_kittest = { version = "0.30", features = ["wgpu"] }
# **必须与 egui_kittest 同时出现**:kittest 给 `egui` 开 accesskit,于是
# `egui::PlatformOutput` 多出 `accesskit_update` 字段;而 `egui-winit` 里对
# 该结构的穷尽解构由**它自己**的同名 feature 控制,不开就少一个字段、E0027
# 整片编不过。两个同名 feature 必须同步。
#
# 放 dev-dependencies 而不是上面的 [dependencies],是靠 `resolver = "2"`:
# dev-deps 的 feature 不统一到正式构建 —— `cargo test`/`--all-targets` 下
# 两者都带 accesskit(编得过),`cargo build --release` 不含 dev-deps,
# 正式 exe 里 egui/egui-winit 都还是原样,不白搭一个 accesskit_winit 进去。
egui-winit = { workspace = true, features = ["accesskit"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# 自建 wgpu device 要阻塞等 `request_device`。TestRenderer::new() 会取
# 枚举到的第一个 adapter(不可控),故不用它,见 examples/ui_shot.rs。
pollster = "0.4"
