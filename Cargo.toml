[workspace]
resolver = "2"
members = [
    "crates/mullion-core",
    "crates/mullion-term",
    "crates/mullion-ssh",
    "crates/mullion-app",
    "crates/mullion-store",
    "crates/mullion-cloud",
]

[workspace.package]
version = "0.1.112"
edition = "2021"
license = "Apache-2.0"

# 版本锁定见 README「版本核对」/ ADR-001。升级单独开 PR(R1),不混功能。
[workspace.dependencies]
alacritty_terminal = "0.26"
vte = "0.15"
# preedit 网格布局(F126)复用 SnapCell::width 同一套宽度判据:alacritty_terminal
# 0.26 内部就是拿这个 crate 的 UnicodeWidthChar 判定 WIDE_CHAR(见其 term/mod.rs
# input()),版本对齐 Cargo.lock 里被它解出来的那个(0.2.2),不能另起一套,
# 否则底色/下划线(按格子画)与文字位置会当场错位。
unicode-width = "0.2"
# 加密后端用 ring(非默认 aws-lc-rs):避免 aws-lc-sys 的 C/汇编构建,
# Linux→Windows 交叉编译干净、原生 Windows 编译也免装 NASM。RSA 密钥仍走独立的 rsa crate。
russh = { version = "0.54", default-features = false, features = ["ring", "flate2", "rsa"] }
# SFTP v3 协议层(F50)。**不依赖 russh 本身**(已核实 2.4.0 的依赖只有 bytes/chrono/
# dashmap/serde/serde_bytes/thiserror/bitflags/log/tokio/tokio-util),吃任意
# AsyncRead+AsyncWrite,与锁定的 russh 0.54 不会版本打架。
russh-sftp = "2.4.0"
winit = "0.30"
wgpu = "23"
glyphon = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
# 切片 A:会话/凭据持久化(见 spec §3)
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chacha20poly1305 = "0.10"                        # XChaCha20-Poly1305;稳定版 API(非 context7 的 bleeding-edge)
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust", "windows-native", "apple-native"] }
# 切片 A2b:GUI 外壳。egui 0.30 已验证与 wgpu 23.0.1 / winit 0.30.13 统一(无重复版本)。
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
rfd = "0.15"
# `local-offset` 是 F186(SFTP 修改时间按本机时区显示)要的。它在 **Unix 上
# 只在单线程进程里返回得出值**(取 `localtime_r` 的 soundness 保护),所以
# `main` 必须在建 tokio 运行时、起看门狗**之前**取一次 —— 见 `localtime.rs`。
# Windows 走 `GetTimeZoneInformation`,没有这个限制。
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
# 日志 facade(0 依赖)。接了它,wgpu/wgpu-hal/naga/winit/glyphon/russh 的内部诊断
# 才会落进我们自己的 mullion.log —— GUI 子系统没控制台、Windows 事件日志又不记录
# 进程挂起,这是唯一能拿到的现场。见 ADR-008。
log = "0.4"
# 切片 B1(F18):系统剪贴板。已作为 egui-winit 的传递依赖在 Cargo.lock 里
# (3.6.1),加直接依赖不引入新版本。关掉默认 features:image-data 会拉进
# image crate(N6 的 exe 体积已超标),我们只要文本。
arboard = { version = "3.6", default-features = false }
# 会话图标(F61):用户导入的 .ico。**刻意不用 `image` crate** —— 上面那条
# `arboard` 注释里写过的理由仍然成立(N6 exe 体积)。`ico` 只拉 byteorder + png,
# png 的 miniz_oxide 是纯 Rust,交叉编译不引入新的 C 依赖。
ico = "0.5"
# F209:剪贴板截图编码成 PNG。**不是新依赖** —— `ico` 本来就把它拉进来了
# (Cargo.lock 里 0.17),这里只是加一条直接依赖好点名用。同理由不用 `image`。
png = "0.17"
# 图标正文按 base64 内嵌进 sessions.toml(用户选定的存储方式:换机器拷配置
# 就带着走)。0.22.1 本来就在 Cargo.lock 里(传递依赖),加直接依赖不引入新版本。
base64 = "0.22"
# 主密码(F71):Argon2id 派生 secrets.enc 的主密钥。0.5.3 本来就在 Cargo.lock 里
# (keyring 的 crypto-rust 特性拉进来的),加直接依赖不引入新版本。
# `default-features = false` + 只开 `alloc`:默认特性会带上 `rand`,而我们的熵
# 已经走 chacha20poly1305 的 OsRng,不需要第二条随机源(N6 exe 体积)。
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# F215:内置编辑器的语法高亮。**特性砍到只剩解析** —— 默认的 `default-onig`
# 会拉进 `onig_sys`(C 库,交叉编译要 mingw 那边也有一份),换成
# `regex-fancy`(纯 Rust 的 `fancy-regex`,Sublime 语法要的反向引用/后顾它支持)。
# 另外三样一律不开:`default-themes`/`plist-load`(主题是我们自己按色板拼的,
# 不从 .tmTheme 读)、`yaml-load`(只吃预编译的 packdump,不在运行期编语法)、
# `html`(不出 HTML)。N6 的 exe 体积盯着这几条。
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
# F270:云端备份的 HTTP 客户端。**阻塞式**,所以 `mullion-cloud` 与 `mullion-store`
# 同样是零 async 的纯 crate;app 侧用 spawn_blocking 挖出去(T3/T7:绝不在事件
# 循环里同步跑网络)。features 见 crates/mullion-cloud/Cargo.toml 顶上的长注释 ——
# `rustls` 这一条是**交叉编译能不能过**的开关,不是口味问题。
ureq = { version = "3", default-features = false, features = ["rustls", "socks-proxy"] }
# SigV4 的 HMAC-SHA256 与内容指纹。两者已在 Cargo.lock(russh 传递依赖),
# 加直接依赖不引入新版本。
sha2 = "0.10"
hmac = "0.12"

# N6(安装包 < 25MB)。在这之前 release 用的是 cargo 默认值,交叉编译出来的
# exe 是 38.6 MiB —— 超标 54%,而且从来没有任何自动化盯着它。
#
# 实测(x86_64-pc-windows-gnu,同一份源码,只换 profile):
#   默认            38.6 MiB
#   lto+cgu=1       17.1 MiB  ← 采用
#   +strip          15.4 MiB
#   +panic=abort    13.9 MiB
#
# **刻意不开 strip**:LTO 把海量单态化重复符号合并掉了(符号数 107433 → 22345),
# strip 的收益从 10.6 MiB 塌缩到 1.7 MiB;而代价是 `logx.rs` 那个 panic 钩子
# 落盘的 backtrace 从函数名退化成一串十六进制地址。ADR-008 说过,GUI 子系统
# 没控制台、事件日志不记进程挂起,那份 backtrace 是唯一能拿到的现场。
#
# **刻意不开 panic=abort**:再省 1.5 MiB,但 `dragout/win.rs` 的 catch_unwind
# (拖出线程 panic 不能带走整个进程)会当场失效,tokio 的任务级 panic 隔离也一起
# 没了 —— 任何一条 SSH/SFTP 后台任务 panic 都会直接杀掉 app。
#
# 代价:release 构建约 2 分钟(实测)。日常 `cargo test` 走 dev profile,不受影响。
[profile.release]
lto = "fat"
codegen-units = 1

# dev 的调试信息降到 line-tables-only。**动机是磁盘，不是速度** —— 实测增量循环
# （`touch app.rs` 后）是 7.15s 编译 + 15.01s 跑完 2205 条测试，链接根本不是瓶颈，
# 所以「换 lld / 给依赖开 opt-level=1」那一类提速手段在这台机器上收益≈0，
# 不做（每次量之前先量，别照搬别的项目的 profile 段）。
#
# 真问题是体积：`target/debug` 一度涨到 539 GB（deps 288 GB + incremental 222 GB），
# 根分区 83% 满。`debug = 2` 是 dev 的默认值，deps 那 288 GB 的大头就是它。
#
# 实测（`cargo clean` 之后，同一份源码）：
#   全量构建 + 跑完 2205 条测试   73.31 s，`target` 共 5.4 GB
#   增量循环（touch app.rs）      5.49 s 编译 / 14.31 s 跑测试
#                                （改之前是 7.15 s / 15.01 s —— 顺带快了一点，
#                                 但那不是动机，别拿它当提速手段推广）
# 对照之前的 563 GB：那 500 多 GB 绝大部分是**历史累积**（不同 fingerprint 的
# 旧产物 + incremental 快照），不是单次构建的必需品。
#
# 代价：dev 下只剩**行号**，没有变量级调试信息。对「靠日志 + 测试、不挂 gdb」
# 的用法够用；`logx.rs` 那个 panic 钩子要的 backtrace 函数名与行号都还在
# （那条链路真正怕的是 strip，见上面 release 段的论证，与这里无关）。
# 要挂调试器的时候临时 `RUSTFLAGS="-C debuginfo=2"` 即可，不必改回来。
#
# 注意 `incremental` 那部分 cargo **不会自己清**，攒够了还得手动 `cargo clean`。
[profile.dev]
debug = 1
