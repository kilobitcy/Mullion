[workspace]
resolver = "2"
members = [
    "crates/mullion-core",
    "crates/mullion-term",
    "crates/mullion-ssh",
    "crates/mullion-app",
    "crates/mullion-store",
]

[workspace.package]
version = "0.1.60"
edition = "2021"
license = "Apache-2.0"

# 版本锁定见 README「版本核对」/ ADR-001。升级单独开 PR(R1),不混功能。
[workspace.dependencies]
alacritty_terminal = "0.26"
vte = "0.15"
# preedit 网格布局(F126)复用 SnapCell::width 同一套宽度判据:alacritty_terminal
# 0.26 内部就是拿这个 crate 的 UnicodeWidthChar 判定 WIDE_CHAR(见其 term/mod.rs
# input()),版本对齐 Cargo.lock 里被它解出来的那个(0.2.2),不能另起一套,
# 否则底色/下划线(按格子画)与文字位置会当场错位。
unicode-width = "0.2"
# 加密后端用 ring(非默认 aws-lc-rs):避免 aws-lc-sys 的 C/汇编构建,
# Linux→Windows 交叉编译干净、原生 Windows 编译也免装 NASM。RSA 密钥仍走独立的 rsa crate。
russh = { version = "0.54", default-features = false, features = ["ring", "flate2", "rsa"] }
# SFTP v3 协议层(F50)。**不依赖 russh 本身**(已核实 2.4.0 的依赖只有 bytes/chrono/
# dashmap/serde/serde_bytes/thiserror/bitflags/log/tokio/tokio-util),吃任意
# AsyncRead+AsyncWrite,与锁定的 russh 0.54 不会版本打架。
russh-sftp = "2.4.0"
winit = "0.30"
wgpu = "23"
glyphon = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
# 切片 A:会话/凭据持久化(见 spec §3)
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chacha20poly1305 = "0.10"                        # XChaCha20-Poly1305;稳定版 API(非 context7 的 bleeding-edge)
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust", "windows-native", "apple-native"] }
# 切片 A2b:GUI 外壳。egui 0.30 已验证与 wgpu 23.0.1 / winit 0.30.13 统一(无重复版本)。
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
rfd = "0.15"
time = { version = "0.3", features = ["formatting"] }
# 日志 facade(0 依赖)。接了它,wgpu/wgpu-hal/naga/winit/glyphon/russh 的内部诊断
# 才会落进我们自己的 mullion.log —— GUI 子系统没控制台、Windows 事件日志又不记录
# 进程挂起,这是唯一能拿到的现场。见 ADR-008。
log = "0.4"
# 切片 B1(F18):系统剪贴板。已作为 egui-winit 的传递依赖在 Cargo.lock 里
# (3.6.1),加直接依赖不引入新版本。关掉默认 features:image-data 会拉进
# image crate(N6 的 exe 体积已超标),我们只要文本。
arboard = { version = "3.6", default-features = false }
# 会话图标(F61):用户导入的 .ico。**刻意不用 `image` crate** —— 上面那条
# `arboard` 注释里写过的理由仍然成立(N6 exe 体积)。`ico` 只拉 byteorder + png,
# png 的 miniz_oxide 是纯 Rust,交叉编译不引入新的 C 依赖。
ico = "0.5"
# 图标正文按 base64 内嵌进 sessions.toml(用户选定的存储方式:换机器拷配置
# 就带着走)。0.22.1 本来就在 Cargo.lock 里(传递依赖),加直接依赖不引入新版本。
base64 = "0.22"
# 主密码(F71):Argon2id 派生 secrets.enc 的主密钥。0.5.3 本来就在 Cargo.lock 里
# (keyring 的 crypto-rust 特性拉进来的),加直接依赖不引入新版本。
# `default-features = false` + 只开 `alloc`:默认特性会带上 `rand`,而我们的熵
# 已经走 chacha20poly1305 的 OsRng,不需要第二条随机源(N6 exe 体积)。
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
