name: release

# 推送 v* tag 时:在 CI 上交叉编译 Windows exe 并发布 Release。
# 复用本机趟通的 mingw-w64 + ring 交叉编译路线(见 docs/cross-compile-windows.md)。
# 用内置 GITHUB_TOKEN 发布,无需任何外部凭证。
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # 允许手动触发,仅构建+传 artifact(调试用,不发 Release)

permissions:
  contents: write   # gh release create 需要写权限(覆盖新库默认的只读 token)

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 mingw-w64 交叉链接器
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: 添加 Windows 交叉编译目标
        run: rustup target add x86_64-pc-windows-gnu

      - name: 交叉编译 release exe
        run: cargo build --release --target x86_64-pc-windows-gnu -p mullion-app

      - name: 验收 — 不得含杂散运行时 DLL(须自包含)
        run: |
          exe=target/x86_64-pc-windows-gnu/release/mullion.exe
          if x86_64-w64-mingw32-objdump -p "$exe" | grep -iE 'libgcc|libwinpthread|libstdc'; then
            echo "::error::exe 非静态链接,含杂散 DLL,用户机会缺 DLL"; exit 1
          fi
          sha256sum "$exe" | tee mullion.exe.sha256

      - name: 发布 Release(仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Mullion 单 pane GUI MVP(F1 SSH + winit/wgpu/glyphon,已在 Windows 11 实机验收)。

          Windows 11 x64,在 PowerShell 里运行(非双击,便于看连接诊断):

              .\mullion.exe user@host -p 22 -i C:\path\to\key.pem

          字体需系统已装 Google Sans Code。附 mullion.exe.sha256 供 Get-FileHash 校验。
          EOF
          gh release create "${{ github.ref_name }}" \
            target/x86_64-pc-windows-gnu/release/mullion.exe \
            mullion.exe.sha256 \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md

      - name: 上传构建产物(手动触发时便于下载验证)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mullion-exe
          path: target/x86_64-pc-windows-gnu/release/mullion.exe
